[package]
name = "stelops"
version = "0.1.0"
edition = "2021"
description = "Read-only / minimal-write ops tool for a Stellereum node store: consensus checkpoint, genesis root, lock clearing, topic derivation."
license = "Apache-2.0"

# ONLY sled. No bincode/serde: the consensus checkpoint is decoded by hand
# from the fixed bincode-1.3 layout, so this crate stays tiny, builds
# offline in seconds and can never disagree with the node about the format.
[dependencies]
sled = "0.34.7"
# Snapshot digests for `diverge`: the same hash the node itself uses, so an
# offline digest always matches what the node would compute.
blake3 = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
