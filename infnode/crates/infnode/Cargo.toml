[package]
name = "infnode"
version = "0.1.0"
edition = "2021"
description = "Инфнод: лёгковесный оверлейный P2P-протокол (QUIC + DHT + storage RF≤3 + rewards + proof-of-storage). Только сетевой слой, без почты."
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
xsalsa20poly1305 = "0.9"
aead = "0.5"
time = { version = "0.3", features = ["std"] }
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = { version = "1", features = ["derive"] }
reed-solomon-erasure = { version = "6.0.0", default-features = false }
ml-kem = "0.3"
# PQ identity/frame-auth backend (Falcon-512). `falcon-rust` is the only
# producer/verifier used by `keyring::PqKeys` and `proto::pq_falcon_*`;
# `pqcrypto-falcon` is kept only for the chain-framing KATs.
falcon-rust = "0.3.1"
pqcrypto-falcon = "0.4.1"
