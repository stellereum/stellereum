# HA JSON-RPC in front of the validator RPC endpoints.
#
# WHY THIS SHAPE
#   Every node binds its RPC to 127.0.0.1 (`STELL_RPC_LISTEN=127.0.0.1:8545`) and
#   only the public origin reaches it. Restarting that origin therefore dropped
#   rpc.stellereum.org for ~13 s during a rolling deploy (2026-11-23). This block
#   keeps that property (no node exposes RPC to the world) and adds two more
#   backends through SSH tunnels started by `scripts/rpc-lb-tunnels.sh`:
#
#     127.0.0.1:8545  node A (local, the current origin)
#     127.0.0.1:8551  node B via reverse SSH tunnel from mainserver
#     127.0.0.1:8552  node D via reverse SSH tunnel from mainserver
#
#   Passive health checks (`max_fails`/`fail_timeout`) mean a restarted node is
#   taken out of rotation after one failure window and returns automatically.
#   `proxy_next_upstream` retries a request on the other backends, so a single
#   node restart is invisible to clients instead of a 13 s outage.
#
# DEPLOY
#   On node A (public origin):
#     install -m 0644 deploy/nginx/rpc-lb.conf /etc/nginx/conf.d/rpc-lb.conf
#     nginx -t && systemctl reload nginx
#   On mainserver (holds SSH keys + local node B):
#     systemctl --user enable --now stell-rpc-tunnels.service
#
# GATE before switching DNS/proxy to it:
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1:18545 \
#     -H 'content-type: application/json' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"stell_blockNumber","params":[]}'
#   then drop one tunnel and repeat: the code must stay 200.

upstream stell_rpc {
    # least_conn spreads read-heavy RPC load; height-aware clients are happy
    # with any backend because all active validators follow the same finalized chain.
    least_conn;

    server 127.0.0.1:8545 max_fails=3 fail_timeout=15s;   # node A (local)
    server 127.0.0.1:8551 max_fails=3 fail_timeout=15s;   # node B (reverse tunnel)
    server 127.0.0.1:8552 max_fails=3 fail_timeout=15s;   # node D (reverse tunnel)

    keepalive 32;
}

# Preserve HTTP/1.1 upstream keepalive (Connection "") for regular JSON-RPC
# requests while allowing WebSocket upgrades when Upgrade is present.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 127.0.0.1:18545;
    server_name rpc.stellereum.org rpc-testnet.stellereum.org;

    # RPC bodies carry transactions; keep the ceiling >= the public vhosts (2M/5M).
    client_max_body_size 5m;

    # Shorter than the node's own request timeout so nginx fails over cleanly.
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    location = /lb-health {
        access_log off;
        add_header content-type application/json always;
        return 200 '{"lb":"ok","backends":["A","B","D"]}';
    }

    location / {
        # Rate limiting (rpc_limit / api_limit) is enforced per client IP on the
        # public :443 server blocks in sites-available/stellereum.

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";

        # Fail over within the SAME request: a restarting backend produces a
        # connection error, the next backend answers, the client sees 200.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        proxy_pass http://stell_rpc;
    }
}
