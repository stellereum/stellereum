# HA JSON-RPC in front of the validator RPC endpoints.
#
# WHY THIS SHAPE
#   Every node binds its RPC to 127.0.0.1 (`STELL_RPC_LISTEN=127.0.0.1:8545`) and
#   only the public origin reaches it. Restarting that origin therefore dropped
#   rpc.stellereum.org for ~13 s during a rolling deploy (2026-11-23). This block
#   keeps that property (no node exposes RPC to the world) and adds two more
#   backends through SSH tunnels started by `scripts/rpc-lb-tunnels.sh`:
#
#     127.0.0.1:8545  node A (local, the current origin)
#     127.0.0.1:8551  node D via tunnel
#     127.0.0.1:8552  node C via tunnel
#
#   Passive health checks (`max_fails`/`fail_timeout`) mean a restarted node is
#   taken out of rotation after one failure window and returns automatically.
#   `proxy_next_upstream` retries a request on the other backends, so a single
#   node restart is invisible to clients instead of a 13 s outage.
#
# DEPLOY (on the origin host, e.g. node A)
#   install -m 0644 rpc-lb.conf /etc/nginx/conf.d/rpc.stellereum.org.conf
#   systemctl enable --now stell-rpc-tunnels.service   # scripts/systemd/
#   nginx -t && systemctl reload nginx
#
# GATE before switching DNS/proxy to it:
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1:18545 \
#     -H 'content-type: application/json' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"stell_blockNumber","params":[]}'
#   then restart one backend and repeat: the code must stay 200.

upstream stell_rpc {
    # least_conn spreads read-heavy RPC load; height-aware clients are happy
    # with any backend because all four follow the same finalized chain.
    least_conn;

    server 127.0.0.1:8545 max_fails=3 fail_timeout=15s;   # node A (local)
    server 127.0.0.1:8551 max_fails=3 fail_timeout=15s;   # node D (tunnel)
    server 127.0.0.1:8552 max_fails=3 fail_timeout=15s;   # node C (tunnel)

    keepalive 32;
}

# Rate limiting: the public RPC is a shared resource. 20 r/s per client with a
# burst of 40 is far above any honest wallet and cheap for the nodes.
limit_req_zone $binary_remote_addr zone=stell_rpc_rl:10m rate=20r/s;

server {
    listen 127.0.0.1:18545;
    server_name rpc.stellereum.org;

    # RPC bodies carry transactions; keep the ceiling generous but bounded.
    client_max_body_size 4m;

    # Shorter than the node's own request timeout so nginx fails over cleanly.
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    location = /lb-health {
        access_log off;
        add_header content-type application/json always;
        return 200 '{"lb":"ok","backends":["A","D","C"]}';
    }

    location / {
        limit_req zone=stell_rpc_rl burst=40 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";

        # Fail over within the SAME request: a restarting backend produces a
        # connection error, the next backend answers, the client sees 200.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        proxy_pass http://stell_rpc;
    }
}
