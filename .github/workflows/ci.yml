# CI — the pull-request / main-branch gate.
#
# This workflow is intentionally hermetic: checkout, toolchain, cargo/npm
# build & test only. It never touches the live cluster, a faucet, a deploy
# target, or any secret. See docs/CI.md for the job graph and local repro.
#
# Keep the curated suite lists in sync with scripts/ci_local.sh.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'full-pq-testnet-*'

# A new push to the same PR/branch cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # GitHub-hosted Linux runners have 4 GB RAM. Two rustc jobs is the
  # conservative ceiling for this dependency graph (the test profile sets
  # opt-level=2 for the node crate and 3 for dependencies).
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'
  TEST_THREADS: '2'

jobs:
  # (a) Formatting across every Rust workspace the gate touches. cargo-fmt
  # follows path dependencies, so the stellereum invocation also covers the
  # infnode sources it links; the explicit loop keeps that behaviour obvious.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --all --check
        run: |
          set -uo pipefail
          rc=0
          for ws in stellereum infnode stellereum-sdk; do
            echo "::group::cargo fmt --all --check ($ws)"
            (cd "$ws" && cargo fmt --all --check) || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # (b) Clippy for the node crate and the infnode workspace. `--all-targets`
  # includes the integration-test crates, so a test-only warning is red too.
  clippy:
    name: clippy (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - stellereum
          - infnode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
          shared-key: clippy-${{ matrix.workspace }}
      - name: cargo clippy --all-targets -- -D warnings
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --locked --all-targets -- -D warnings

  # (c) Unit/library tests. Integration suites are deliberately excluded here
  # so a single red binary does not mask the rest of the PR gate.
  test-lib:
    name: test-lib
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            stellereum
            infnode
          shared-key: test-lib
      - name: lib tests (stellereum)
        working-directory: stellereum
        run: cargo test --locked --lib -- --test-threads="$TEST_THREADS"
      - name: lib tests (infnode)
        working-directory: infnode
        run: cargo test --locked --lib -- --test-threads="$TEST_THREADS"

  # (d) The curated heavy integration suites, one matrix leg per category.
  # The whole workspace is 340+ binaries; running all of it belongs to the
  # nightly authoritative gate (.github/workflows/nightly.yml).
  test-suites:
    name: test-suites (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: consensus
            tests: >-
              consensus_liveness_harness
              consensus_byzantine_tests
              consensus_security_tests
              bft_lock_safety_tests
              liveness_horizon_tests
              sim_tempo_target06_tests
          - suite: state
            tests: >-
              state_root_completeness_tests
              state_commit_batch_tests
              apply_floor_tests
              parallel_apply_parity_tests
              block_packing_scale_tests
          - suite: rpc
            tests: >-
              rpc_tests
              rpc_batch_tests
              rpc_ws_tests
              rpc_surface_audit_tests
          - suite: compact
            tests: >-
              compact_gossip_tests
              pentest2_network_compact
          - suite: sync
            tests: >-
              sync_adversarial_tests
              sync_walk_concurrency_tests
              catch_up_tests
              epoch_sync_tests
          - suite: xshard
            tests: >-
              xshard_2pc_tests
              xshard_replay_tests
              cross_shard_e2e_pq_tests
              cross_shard_anchor_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellereum
          shared-key: test-suites
      - name: Run curated suites
        working-directory: stellereum
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          for t in $TESTS; do
            echo "::group::cargo test --test $t"
            cargo test --locked --test "$t" -- --test-threads="$TEST_THREADS"
            echo "::endgroup::"
          done

  # (e) The two client SDKs. The Rust SDK tests use a loopback TCP mock; the
  # JS suite uses node:test and a mock fetch, so neither needs a live node.
  sdk:
    name: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Node 22.6-22.17 needs the flag for direct .ts execution; 22.18+ turns
      # type stripping on by default and tolerates the flag.
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellereum-sdk
          shared-key: sdk-rust
      - name: Rust SDK tests
        working-directory: stellereum-sdk
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - name: Install sdk-js dependencies
        working-directory: sdk-js
        run: npm ci --no-audit --no-fund
      - name: sdk-js RPC types sync check
        working-directory: sdk-js
        run: npm run check:rpc-types
      - name: sdk-js typecheck
        working-directory: sdk-js
        run: npm run typecheck
      - name: sdk-js tests
        working-directory: sdk-js
        run: npm test
      - name: sdk-js build
        working-directory: sdk-js
        run: npm run build

  # (f) The operator load-test harness is a standalone crate (it embeds node
  # sources via #[path]). Build it so refactors cannot silently break it.
  loadtest-build:
    name: loadtest-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/loadtest/loadtest
          shared-key: loadtest
      - name: Build load-test harness
        working-directory: scripts/loadtest/loadtest
        run: cargo build --locked

  # (g) Supply chain: advisories, licence drift, wildcard requirements, unknown
  # registries. Policy lives in deny.toml. Read-only, no secrets.
  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          manifest-path: stellereum/Cargo.toml

  # (h) RustSec advisory check as an independent second opinion: cargo-deny can
  # be silenced with an ignore, cargo-audit cannot be silenced by this repo at
  # all, so a disagreement between them is visible in review.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: stellereum
