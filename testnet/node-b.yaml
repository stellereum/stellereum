# =============================================================================
# Stellereum testnet — node B (validator 2 of 2)
# =============================================================================
#
# Structurally identical to node-a.yaml. The differences are the ones that must
# differ (name, listen port, the peer's identity) and the ones that must be
# identical in spirit (same retention, same fee floor, same genesis
# parameters) even though they live in the environment rather than here.
#
# Read node-a.yaml first: the explanation of how the validator set is derived
# from `peers:` and `validators:` is there, and it is the part that breaks
# silently.
#
# ------------------------------------------------------------------
# ⚠  TWO VALIDATORS IS THE SMALLEST USEFUL SET AND THE MOST FRAGILE
# ------------------------------------------------------------------
# quorum_power() is floor(2 * total_power / 3) + 1. With unit power that is:
#
#     1 validator  ->  quorum 1  (solo testnet, fine)
#     2 validators ->  quorum 2  (BOTH required)
#     3 validators ->  quorum 3  (BOTH required — not the 2-of-3 you would
#                                    expect; floor(6/3)+1 = 3)
#     4 validators ->  quorum 3  (first size where one can be down)
#     5 validators ->  quorum 4
#
# So with the two-node setup below, taking either node offline stops the chain.
# The survivor does not carry on: it has power 1 against a quorum of 2, so it
# cannot finalize a precommit quorum, and it sits in a view-change loop
# re-broadcasting the same votes every 3 seconds. There is no catch-up path for
# a single node finalizing alone, and the genesis fingerprint guard would
# reject a fresh data directory anyway.
#
# For a testnet you intend to keep up, add nodes C and D and list all four ids in
# `validators:` on every node — quorum becomes 3 of 4, and the chain survives one
# node being offline. Every extra id must appear in EVERY node's `validators:`
# list and every node needs a `peers:` entry with that node's `ed-pub`.
#
# Downtime slashing is a separate concern and applies to the staking ledger's
# bonded validators, not to the genesis-configured set per se — see
# ../../PROTOCOL.md I5: 10 consecutive missed heights is a 0.1% burn, with a
# 100-height cooldown between penalties.
# ------------------------------------------------------------------

name: stellereum-testnet-b

# QUIC listener. Must differ from node A's 9410 if both run on one host.
listen: "0.0.0.0:9411"
client-listen: "0.0.0.0:9411"

# Informational only (see node-a.yaml): node B dials the `endpoints:` of its
# configured peers, not `advertise`.
advertise: "127.0.0.1:9411"

storage-roles:
  - mail
  - files

# 2 = info. Required in practice: the FINALIZED block line and the view-change
# line are both info level, and they are the only two things that distinguish a
# healthy node from one stuck re-proposing.
log-level: 2

# infnode transport metrics. Different port from node A's 9401.
metrics-listen: "127.0.0.1:9402"

# Same TOFU posture as node A, and for the same reason: this is a public
# testnet, so refuse nothing and grant nothing by default. Unknown peers get
# read-only DHT discovery only.
#
# DEV/TOFU MODE: `allow-unknown: true` is a development-environment setting. On
# a PUBLIC testnet turn it off (`allow-unknown: false` or remove the line) and
# pin every node under `peers:`. The value is network config — change it
# consistently across the network (coordinated upgrade), not per node.
allow-unknown: true
unknown-allow:
  - "dht.lookup"
  - "dht.update"
  - "dht.find_node"
  - "dht.find_value"

# PQ MODE (M-01 fallback, opt-in): this file is transport-only; PQ mode comes
# from the process env (see genesis.env). Unset STELL_PURE_PQ = dual-stack
# default (Ed25519 + PQ admitted); STELL_PURE_PQ=1 on EVERY node = PQ-only.
# Mixed modes split the chain — change it as a coordinated upgrade.
# --- peers -------------------------------------------------------------------
# The roles of A and B are symmetric, so A's `peers:` entry points at this file's
# `endpoints`, and this file's points at A's. A dial loop that has nowhere to
# go is the usual reason a two-node cluster never reaches quorum: each node
# configured only itself, or configured a peer entry but never started it.
peers:
  - name: stellereum-testnet-a
    # PLACEHOLDER — node A's id (40 hex chars after the optional `inf1:`).
    node-id: "inf1:PLACEHOLDER_A_NODE_ID_00000000000000000000"
    # PLACEHOLDER — node A's ed-pub (64 hex chars). This is A's consensus
    # identity and the account funded at genesis.
    ed-pub: "PLACEHOLDER_A_ED_PUB_0000000000000000000000000000000000000000000000000000"
    # PLACEHOLDER — node A's x-pub (64 hex chars).
    x-pub: "PLACEHOLDER_A_X_PUB_0000000000000000000000000000000000000000000000000000000"
    endpoints:
      - "127.0.0.1:9410"

# --- validators --------------------------------------------------------------
# The same two ids as node A's list, in the same order. The order does not
# matter for the root — the set is a sorted BTreeMap — but keeping the two files
# side by side comparable is worth more than the keystrokes.
#
# Replace BOTH entries. B's own id is the one from B's own "NODE IDENTITY" log
# line; leaving a placeholder here means build_validator_set cannot match it
# against anything, so B's peers never become validators and B runs solo.
validators:
  - "inf1:PLACEHOLDER_A_NODE_ID_00000000000000000000"
  - "inf1:PLACEHOLDER_B_NODE_ID_00000000000000000000"
