# ------------------------------------------------------------------
# status.stellereum.org — Standalone public status page reverse proxy.
# Upstream: ops/status/status_server.py bound to 127.0.0.1:8095.
#
# Installed as /etc/nginx/sites-available/status.stellereum.org.conf
# and symlinked into /etc/nginx/sites-enabled/.
# Certificate: shared stellereum lineage (managed by certbot).
# ------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=stell_status_rl:10m rate=15r/s;

server {
    listen 443 ssl;
    server_name status.stellereum.org;

    ssl_certificate /etc/letsencrypt/live/stellereum/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellereum/privkey.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/html application/json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    # Keep Prometheus metrics internal-only; expose /, /api/status.json, /status.json, /health, /readyz.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8095;
    }

    location / {
        limit_req zone=stell_status_rl burst=30 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:8095;
    }
}

server {
    listen 80;
    server_name status.stellereum.org;
    return 301 https://status.stellereum.org$request_uri;
}
