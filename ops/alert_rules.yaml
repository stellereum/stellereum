# Stellereum consensus / node alert rules (Prometheus format).
#
# Load with:  prometheus --config.file=... (rule_files: ["ops/alert_rules.yaml"])
# or `promtool check rules ops/alert_rules.yaml`.
#
# METRIC PROVENANCE (do not invent names): every `stell_*` series below is a
# public constant in stellereum/src/metrics.rs and is rendered by
# `Registry::render` under GET /metrics (see also stellereum/src/explorer.rs).
# Verified 2026-11-02 by grepping the quoted literal in metrics.rs:
#   stell_consensus_height, stell_consensus_round, stell_weak_qc_refused_total,
#   stell_mempool_size, stell_data_dir_bytes, stell_peer_latency_seconds,
#   stell_fork_total, stell_divergence_total, stell_nil_breaker_fires_total,
#   stell_nil_rounds_total, stell_persist_queue_dropped_total,
#   stell_slow_validation_total, stell_validator_set_fragile,
#   stell_validator_set_size
#
# Exception: stell_cluster_*, stell_tick_* and stell_clock_* in the
# stellereum-liveness group do NOT come from /metrics. They are written by
# scripts/cluster_liveness_watch.sh through the node_exporter textfile
# collector (see the group comment below and ops/alerts.md).
#
# Peer-count note: there is NO dedicated peer-count gauge in metrics.rs.
# PeersLost derives the count from the per-peer label set of
# stell_peer_latency_seconds_count (histogram _count series, one per peer id),
# falling back to 0 via stell_consensus_height when no peer series are emitted.
# Stale series linger until the peer is re-observed, so this alert is a
# lower-bound tripwire, not an exact census. See ops/alerts.md.
#
# Disk note: stell_data_dir_bytes is a byte GAUGE, not a percentage.
# DISK_THRESHOLD_BYTES below is 0.8 x 100 GiB. Set it to 0.8 x YOUR volume
# size (bytes). A predict_linear growth companion is included.

groups:
  - name: stellereum-finals
    interval: 30s
    rules:
      - alert: FinalsStalled
        expr: delta(stell_consensus_height[10m]) <= 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Finalized height has not grown for >10m on {{ $labels.instance }}"
          runbook: "ops/alerts.md#finalsstalled"

      - alert: RoundExplosion
        expr: max_over_time(stell_consensus_round[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consensus round stuck above 10 on {{ $labels.instance }} (rounds reset each height)"
          runbook: "ops/alerts.md#roundexplosion"

      - alert: NilRoundsStall
        expr: increase(stell_nil_rounds_total[10m]) >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ">=3 nil rounds in 10m on {{ $labels.instance }} (finality stalling)"
          runbook: "ops/alerts.md#nilroundsstall"

      - alert: NilBreakerFired
        expr: increase(stell_nil_breaker_fires_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Nil-storm circuit breaker fired on {{ $labels.instance }}"
          runbook: "ops/alerts.md#downtime-evidence-spike"

  - name: stellereum-integrity
    interval: 30s
    rules:
      - alert: QCFailures
        expr: increase(stell_weak_qc_refused_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Weak/unilateral QC refusals on {{ $labels.instance }} (finalization firewall engaged)"
          runbook: "ops/alerts.md#qcfailures"

      - alert: ForkSpike
        expr: increase(stell_fork_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Conflicting-block sightings on {{ $labels.instance }}"
          runbook: "ops/alerts.md#downtime-evidence-spike"

      - alert: DivergenceSpike
        expr: increase(stell_divergence_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Post-state-root divergence refusals on {{ $labels.instance }}"
          runbook: "ops/alerts.md#downtime-evidence-spike"

      - alert: ValidatorSetFragile
        expr: stell_validator_set_fragile == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Validator set quorum fragile on {{ $labels.instance }} (size {{ $value }} series stell_validator_set_size)"
          runbook: "ops/alerts.md#validatorsetfragile"

  - name: stellereum-pool
    interval: 30s
    rules:
      # Mempool global buffer ceiling is MAX_GLOBAL_BUFFERED_TXS = 2048
      # (stellereum/src/mempool.rs). Warn at ~80%, critical at ~93%.
      - alert: MempoolSaturatedWarn
        expr: stell_mempool_size > 1600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mempool >1600 txs on {{ $labels.instance }} (~80% of 2048 cap)"
          runbook: "ops/alerts.md#mempoolsaturated"

      - alert: MempoolSaturatedCrit
        expr: stell_mempool_size > 1900
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Mempool >1900 txs on {{ $labels.instance }} (admission about to shed load)"
          runbook: "ops/alerts.md#mempoolsaturated"

      - alert: SlowValidationSpike
        expr: increase(stell_slow_validation_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Proposal validations breaching backpressure threshold on {{ $labels.instance }}"
          runbook: "ops/alerts.md#downtime-evidence-spike"

      - alert: PersistQueueDrops
        expr: increase(stell_persist_queue_dropped_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Persist queue dropping jobs on {{ $labels.instance }} (disk too slow)"
          runbook: "ops/alerts.md#downtime-evidence-spike"

  - name: stellereum-disk
    interval: 1m
    rules:
      # 0.8 x 100 GiB = 85899345920. REPLACE with 0.8 x your volume bytes.
      - alert: DiskAbove80Pct
        expr: stell_data_dir_bytes > 85899345920
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Data dir past 80% budget on {{ $labels.instance }} ({{ $value }} bytes)"
          runbook: "ops/alerts.md#diskabove80pct"

      - alert: DiskGrowthFast
        expr: predict_linear(stell_data_dir_bytes[1h], 6 * 3600) > 107374182400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Data dir on pace to exceed 100 GiB within 6h on {{ $labels.instance }}"
          runbook: "ops/alerts.md#diskabove80pct"

  - name: stellereum-net
    interval: 30s
    rules:
      # Derived peer count: number of distinct `peer` label values per instance
      # currently exposing SELF-MEASURED latency (_count of the histogram).
      # Falls back to 0 when an active node has zero peer series.
      # Tune `3` to your minimum peer floor.
      - alert: PeersLost
        expr: |
          (
            count by (instance) (
              count by (instance, peer) (stell_peer_latency_seconds_count)
            )
            or
            (count by (instance) (stell_consensus_height) * 0)
          ) < 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fewer than 3 observed peers on {{ $labels.instance }} (stale series linger; see runbook)"
          runbook: "ops/alerts.md#peerslost"

  - name: stellereum-liveness
    interval: 30s
    rules:
      # These series come from the node_exporter TEXTFILE collector, not from
      # the node's /metrics endpoint. They are written by
      # scripts/cluster_liveness_watch.sh, which also parses `[perf] tick`
      # journal lines and probes each node's clock:
      #
      #   node_exporter --collector.textfile.directory=<dir containing
      #     stell_cluster_liveness.prom>
      #
      # The `instance` label is the node_exporter target that runs the
      # watcher, so run one watcher per cluster and keep it scraped. A dead
      # watcher leaves the last sample in place; alert on
      # `up{job="node_exporter"} == 0` separately if the watcher host is in
      # scope.
      #
      # Tick metrics are computed only over journal lines the node actually
      # emitted: it logs `[perf] tick` only when a tick takes >=400 ms. So
      # p50/p99 describe SLOW ticks, and `stell_tick_over_1s_ratio` is the
      # fraction of logged ticks over 1 s, not of all ticks. Read
      # `stell_tick_samples` alongside them; 0 samples means the journal
      # command returned nothing (not a healthy node). See
      # docs/TESTNET_READINESS_OPS.md §7.1.
      - alert: ClusterLivenessFailed
        expr: stell_cluster_liveness_ok == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "cluster_liveness.sh reports STALLED/DIVERGED on {{ $labels.instance }}"
          description: "stell_cluster_liveness_ok has been {{ $value }} for 2m. Run scripts/cluster_liveness.sh with --journal for the per-node reason."
          runbook: "docs/TESTNET_READINESS_OPS.md#9-restart-procedures-one-node--all-nodes"

      - alert: ClusterHeightSpread
        expr: stell_cluster_spread > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Validator height spread is {{ $value }} blocks on {{ $labels.instance }} (threshold: >1)"
          description: "One or more validators are behind the tip. Do not wipe data; check height/round split and restart only the lagging node per the runbook."
          runbook: "docs/TESTNET_READINESS_OPS.md#9-restart-procedures-one-node--all-nodes"

      - alert: TickP99High
        expr: stell_tick_p99_ms > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tick p99 is {{ $value }} ms on node {{ $labels.node }} (threshold: 2000 ms)"
          description: "Consensus ticks are blocking for seconds inside apply+flush, which defers proposals and widens block gaps. Check host CPU/IO, running builds, and stell_tick_samples."
          runbook: "ops/alerts.md#tickp99high"

      - alert: TickSlowRatioHigh
        expr: stell_tick_over_1s_ratio > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} of logged ticks exceed 1 s on node {{ $labels.node }} (threshold: 0.2)"
          description: "More than 20% of logged tick lines are >1000 ms. The node logs only ticks >=400 ms, so this is a fraction of slow ticks, not all ticks."
          runbook: "ops/alerts.md#tickslowratiohigh"

      - alert: ClockSkew
        expr: stell_clock_sync_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Clock sync is failing on node {{ $labels.node }} (stell_clock_sync_ok={{ $value }}; check stell_clock_skew_ms)"
          description: "A node offset beyond 1000 ms (or NTP explicitly disabled/unknown) corrupts block-timestamp sampling, producing negative intervals and fake block-time gaps. Enable NTP and verify with timedatectl timesync-status."
          runbook: "ops/alerts.md#clockskew"

# ==============================================================================
# 4-VALIDATOR CLUSTER RULES LIVE IN ops/observability/alerts.yml
#
# THIS FILE IS THE REGISTRY-ONLY REFERENCE (lab Prometheus, one scrape target).
# The canonical rules for the live A/B/C/D cluster — the set scraped through
# scripts/observe-local.sh tunnels — are in ops/observability/alerts.yml, with
# node-exporter host rules and the validator-participation families. Loading
# both files into one Prometheus would double-page on overlapping signals, so
# do not copy the cluster rules here.
#
# Name mapping (old name here -> canonical name there):
#   FinalsStalled       -> BlockStall (60 s) + NodeOutOfSync (>50 blocks)
#   RoundExplosion      -> no direct twin; round motion is on the dashboard
#   NilRoundsStall      -> no direct twin; nil-rate panel + BlockStall
#   ValidatorSetFragile -> ValidatorQuorumLow (also covers size < 4)
#   ForkSpike           -> ForkDetected (any increase, 1 m)
#   DivergenceSpike     -> DivergenceDetected (any increase, 1 m)
#   PersistQueueDrops   -> PersistQueueBacklog (depth > 100, 5 m) for the
#                          warning; dropped-jobs stays a critical here
#   DiskAbove80Pct      -> DiskUsageHigh (node_exporter, bytes -> percent)
#   DiskGrowthFast      -> DiskWillFillIn24h (predict_linear, 24 h)
#
# If you tune a threshold for the live cluster, edit
# ops/observability/alerts.yml only. Runbooks for the new names are in
# ops/observability/README.md; the entries above stay valid for this file.
# ==============================================================================
