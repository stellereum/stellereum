apiVersion: 1

# Prometheus runs on the same host with network_mode: host, so the datasource
# URL is loopback. uid is pinned because the provisioned dashboard references
# datasource uid "prometheus".
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.55.1
