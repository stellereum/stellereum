# CI — the pull-request / main-branch gate.
#
# This workflow is intentionally hermetic: checkout, toolchain, cargo/npm
# build & test only. It never touches the live cluster, a faucet, a deploy
# target, or any secret. See docs/CI.md for the job graph and local repro.
#
# Keep the curated suite lists in sync with scripts/ci_local.sh.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'full-pq-testnet-*'

# A new push to the same PR/branch cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # GitHub-hosted Linux runners have 4 GB RAM. Two rustc jobs is the
  # conservative ceiling for this dependency graph (the test profile sets
  # opt-level=2 for the node crate and 3 for dependencies).
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'
  TEST_THREADS: '2'

jobs:
  # (a) Formatting across the unified root workspace.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # (b) Clippy across the unified workspace. `--all-targets` includes the
  # integration-test crates, so a test-only warning is red too.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: clippy-workspace
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # (c) Unit/library tests across the unified workspace. Integration suites are
  # deliberately excluded here so a single red binary does not mask the PR gate.
  test-lib:
    name: test-lib
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: test-lib
      - name: workspace lib tests
        # `stellereum` unit tests share the process-global PQ_COMMITTED_REGISTRY;
        # `--lib` must run with TEST_THREADS=1 (see docs/CI.md).
        env:
          TEST_THREADS: '1'
        run: cargo test --workspace --locked --lib -- --test-threads="$TEST_THREADS"

  # (d) The curated heavy integration suites, one matrix leg per category.
  # The whole workspace is 340+ binaries; running all of it belongs to the
  # nightly authoritative gate (.github/workflows/nightly.yml).
  test-suites:
    name: test-suites (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: consensus
            tests: >-
              consensus_liveness_harness
              consensus_byzantine_tests
              consensus_security_tests
              bft_lock_safety_tests
              liveness_horizon_tests
              sim_tempo_target06_tests
              w10_sortition_and_jail_gates_tests
              w11_cnvrf_epoch_churn_tests
              w12_pipeline_gate_tests
              w12_pipeline_runtime_state_tests
          - suite: state
            tests: >-
              state_root_completeness_tests
              state_commit_batch_tests
              apply_floor_tests
              parallel_apply_parity_tests
              block_packing_scale_tests
              w13_domain_overlays_tests
              w13_parallel_native_and_stm_parity_tests
              w10_deploy_contract_abi_tests
              w9_core_polish_tests
          - suite: rpc
            tests: >-
              rpc_tests
              rpc_batch_tests
              rpc_ws_tests
              rpc_surface_audit_tests
              w14_shard_rpc_router_tests
          - suite: compact
            tests: >-
              compact_gossip_tests
              pentest2_network_compact
          - suite: sync
            tests: >-
              sync_adversarial_tests
              sync_walk_concurrency_tests
              catch_up_tests
              epoch_sync_tests
          - suite: xshard
            tests: >-
              xshard_2pc_tests
              xshard_replay_tests
              cross_shard_e2e_pq_tests
              cross_shard_anchor_tests
              w16_bridge_deposit_height_key_tests
              w14_dynamic_sharding_tests
          - suite: hardening
            tests: >-
              w8_cli_unjail_and_upgrader_tests
              w8_cnvrf_and_mev_hardening_tests
              w8_polish_hardening_tests
              w8_supply_and_network_fixes
              w9_cli_wallet_and_config_tests
              w11_mev_kem_registry_wiring_tests
              w13_scheduler_access_tests
              w13_contract_stm_trace_tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: test-suites
      - name: Run curated suites
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          for t in $TESTS; do
            echo "::group::cargo test -p stellereum --test $t"
            cargo test --locked -p stellereum --test "$t" -- --test-threads="$TEST_THREADS"
            echo "::endgroup::"
          done

  # (d2) Integration suites for the sibling workspace crates and SDK node-parity.
  sibling-suites:
    name: sibling-suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: sibling-suites
      - name: Sibling workspace integration tests
        run: |
          set -euo pipefail
          for pkg in stellereum-verifier stellereum-indexer stellereum-ledger-tool stellereum-upgrader infnode infmail; do
            echo "::group::cargo test --locked -p $pkg --tests"
            cargo test --locked -p "$pkg" --tests -- --test-threads="$TEST_THREADS"
            echo "::endgroup::"
          done
      - name: Rust SDK node-parity tests
        run: cargo test --locked -p stellereum-sdk --features node-parity -- --test-threads="$TEST_THREADS"

  # (e) The two client SDKs and the browser WASM signer. The Rust SDK tests use
  # a loopback TCP mock; the JS suite uses node:test and a mock fetch, so neither
  # needs a live node.
  sdk:
    name: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Node 22.6-22.17 needs the flag for direct .ts execution; 22.18+ turns
      # type stripping on by default and tolerates the flag.
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: sdk-rust
      - name: Rust SDK tests
        run: cargo test --locked -p stellereum-sdk
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - name: Install sdk-js dependencies
        working-directory: sdk-js
        run: npm ci --no-audit --no-fund
      - name: sdk-js RPC types sync check
        working-directory: sdk-js
        run: npm run check:rpc-types
      - name: sdk-js typecheck
        working-directory: sdk-js
        run: npm run typecheck
      - name: sdk-js tests
        working-directory: sdk-js
        run: npm test
      - name: sdk-js build
        working-directory: sdk-js
        run: npm run build

  # (e2) Standalone browser WASM Falcon-512 signer (`stellereum-wasm`).
  wasm:
    name: wasm (stellereum-wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: stellereum-wasm
          shared-key: stellereum-wasm
      - name: stellereum-wasm tests
        working-directory: stellereum-wasm
        run: cargo test --locked
      - name: stellereum-wasm wasm32 build
        working-directory: stellereum-wasm
        run: cargo build --locked --target wasm32-unknown-unknown --release

  # (f) The operator load-test harness is a standalone crate (it embeds node
  # sources via #[path]). Build it so refactors cannot silently break it.
  loadtest-build:
    name: loadtest-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: scripts/loadtest/loadtest
          shared-key: loadtest
      - name: Build load-test harness
        working-directory: scripts/loadtest/loadtest
        run: cargo build --locked

  # (g) Supply chain: advisories, licence drift, wildcard requirements, unknown
  # registries. Policy lives in deny.toml. Read-only, no secrets.
  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@11dff63170bf3644e31564079dcf480e70a2d8d0 # v2
        with:
          command: check
          arguments: --all-features
          manifest-path: Cargo.toml

  # (h) RustSec advisory check as an independent second opinion: cargo-deny can
  # be silenced with an ignore, cargo-audit cannot be silenced by this repo at
  # all, so a disagreement between them is visible in review.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
