[package]
name = "stell-wallet"
version = "0.1.0"
edition = "2021"
description = "Official Lightweight CLI Wallet & SPV Client for Stellereum L1 Blockchain"

[[bin]]
name = "stell"
path = "src/main.rs"

[dependencies]
stellereum = { path = "../stellereum" }
infnode = { path = "../infmail-valid-backend/crates/infnode" }
anyhow = "1"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
curve25519-dalek = { version = "4", features = ["rand_core"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
aead = "0.5"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
colored = "2"
qrcode = "0.14"
rpassword = "7"
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"
ureq = "2.12"
