# Stellereum public RPC reverse-proxy — nginx snippet (http context).
#
# SCOPE
#   Public edge for the Stellereum testnet node:
#     rpc.stellereum.org       -> 127.0.0.1:8545  (standalone JSON-RPC)
#     explorer.stellereum.org  -> 127.0.0.1:8080  (gateway: explorer UI + API + /rpc)
#   Grounded in docs/RPC.md, docs/OPERATIONS.md and src/client_ip.rs:
#     - node binds loopback only (STELL_RPC_LISTEN / STELL_EXPLORER_LISTEN
#       default to 127.0.0.1); this proxy is the ONLY public path in.
#     - JSON-RPC: POST-only to `/`, body <= 1 MiB (MAX_RPC_BODY), batch arrays
#       refused with -32600, no contract-execution method (no eth_call
#       equivalent), `stell_sendRawTransaction` gated by STELL_RPC_AUTH_TOKEN.
#     - rate limits: gateway default 30 req/s/IP (STELL_RATE_LIMIT_PER_SEC,
#       src/explorer.rs); standalone RPC default 300 req/s/IP
#       (STELL_STANDALONE_RATE_LIMIT, src/rpc.rs). Edge enforces 30 r/s/IP so
#       the documented public budget holds even if node env is re-tuned.
#     - real client IP: node resolves it from proxy headers ONLY when the TCP
#       peer is trusted (STELL_TRUSTED_PROXY_CIDRS, loopback-only by default)
#       with `rightmost` XFF discipline (STELL_XFF_MODE, src/client_ip.rs).
#       nginx on the same host IS the loopback peer, so defaults just work.
#       This file APPENDS ($proxy_add_x_forwarded_for) — never overwrite with
#       $remote_addr alone unless you also switch the node to leftmost mode
#       (unsafe with appending proxies; see src/client_ip.rs spoofing notes).
#
# INSTALL
#   1. Copy to /etc/nginx/stellereum/nginx-rpc.conf (or conf.d equivalent).
#   2. Include from the http{} context of nginx.conf:
#        http {
#          ...
#          include /etc/nginx/stellereum/nginx-rpc.conf;
#        }
#      Do NOT include inside a server{} block: limit_req_zone / upstream /
#      map require http context.
#   3. Fill the OPERATOR placeholders (domain already set; TLS paths + optional
#      Cloudflare ranges still stubbed) and run:  nginx -t && systemctl reload nginx
#
# NOTE on upstream ports: production defaults per docs/RPC.md are 8545 (RPC)
#   and 8080 (explorer). The dev node on THIS host currently listens on 8546
#   (custom override); change the `server 127.0.0.1:...` lines if you proxy
#   a non-default layout. Keep loopback — never publish the node ports
#   directly (docs/OPERATIONS.md section 6).

# --- abuse guards (http context) -------------------------------------------
# 30 r/s/IP mirrors the node's public budget; burst absorbs legit spikes
# (wallet fan-out, explorer polling) without queueing: excess gets 429, not delay.
limit_req_zone  $binary_remote_addr  zone=stell_rpc:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=stell_exp:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr  zone=stell_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Hide version banner on all edge responses.
server_tokens off;

# --- X-Forwarded-For charset validation ------------------------------------
# Legit XFF values are comma-separated IPs/hosts (plus RFC 7239 `for=` pairs
# when a CDN copies them over). This map rejects control characters and header
# noise; semantic spoof-resistance comes from APPEND mode below + the node's
# `rightmost` discipline (attacker-forged left entries are ignored).
# Empty (direct clients, no CDN) is allowed.
map $http_x_forwarded_for $xff_ok {
    default  0;
    ""       1;
    # Single token on purpose: nginx splits map patterns on literal spaces
    # even inside quotes, so whitespace is matched with \s (written \\s:
    # nginx unescapes it once before PCRE sees \s).
    ~"^[A-Za-z0-9_.,:=\\s/-]+$"  1;
}

# --- upstreams (loopback only) ----------------------------------------------
upstream stell_rpc {
    server 127.0.0.1:8545 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream stell_explorer {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- RPC: rpc.stellereum.org -> 127.0.0.1:8545 ------------------------------
server {
    listen 80;
    listen [::]:80;
    # OPERATOR: add evm.stellereum.org here ONLY after the EVM shim serves
    # eth_* on its own port; then point stell_rpc at the shim port (one line).
    server_name rpc.stellereum.org;

    if ($xff_ok = 0) { return 400; }

    # Request-body cap MUST match the node: MAX_RPC_BODY = 1 MiB, larger ->
    # -32600 "request too large". Reject at edge before proxying.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # Security headers (JSON-RPC has no browser surface; strict is safe here).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # TRUSTED-PROXY STUB (currently inert: direct origin, nginx IS the peer).
    # When a CDN (e.g. Cloudflare) sits in front, uncomment, paste the live
    # ranges from https://www.cloudflare.com/ips, AND extend the node's
    # STELL_TRUSTED_PROXY_CIDRS with the same ranges — otherwise $binary_remote_addr
    # (and the node's own limiter) still sees the CDN, not the client.
    #   set_real_ip_from 173.245.48.0/20;
    #   # ... (full Cloudflare IPv4/IPv6 list) ...
    #   real_ip_header CF-Connecting-IP;
    #   real_ip_recursive on;

    location / {
        # The node router is exactly ("POST /") — GET or any other path is a
        # node-side 404, so refuse it at edge.
        limit_except POST { deny all; }

        # 30 r/s + burst 60 (nodelay: overflow -> fast 429, no queue lag).
        limit_req  zone=stell_rpc burst=60 nodelay;
        limit_conn stell_conn 20;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Append-only forwarding: preserves the chain the node's `rightmost`
        # mode needs. Do NOT replace with `$remote_addr` alone.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_pass http://stell_rpc;
        proxy_request_buffering on;
    }

    # Edge-local health (nginx itself, not the node).
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 200 'ok';
    }
}

# --- Explorer: explorer.stellereum.org -> 127.0.0.1:8080 --------------------
server {
    listen 80;
    listen [::]:80;
    server_name explorer.stellereum.org;

    if ($xff_ok = 0) { return 400; }

    # Same 1 MiB cap: the gateway nests the same JSON-RPC router at /rpc.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # Explorer serves a browser page: SAMEORIGIN (not DENY) so operator
    # dashboards may frame it; no CSP here — the page inlines scripts/styles
    # and a strict policy would break it. Revisit if the page gains a nonce.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # set_real_ip_from ... (same trusted-proxy stub as the RPC server above);
    # see that block before enabling a CDN in front of this host.

    # Liveness probe: cheap by design (no locks/state reads, src/explorer.rs).
    # NO rate limiting here — load-balancer / watchdog polls must never 429.
    location = /healthz {
        limit_except GET { deny all; }
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stell_explorer;
    }

    # Faucet endpoint: node-side token (STELL_FAUCET_TOKEN, fail-closed) +
    # per-IP drip budget already apply; edge adds a tight burst so one client
    # cannot burn the shared limiter budget with faucet retries.
    location ~ ^/api/faucet/ {
        limit_except POST { deny all; }
        limit_req  zone=stell_exp burst=5 nodelay;
        limit_conn stell_conn 10;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stell_explorer;
    }

    # Everything else: UI, /api/*, /metrics, /readyz, nested /rpc.
    location / {
        limit_req  zone=stell_exp burst=60 nodelay;
        limit_conn stell_conn 20;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stell_explorer;
        proxy_request_buffering on;
    }

    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 200 'ok';
    }
}

# --- TLS STUB (commented until the operator provides certificates) -----------
