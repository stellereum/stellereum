# Prometheus for the live 4-validator Stellereum cluster.
#
# Network model (see README "Why the nodes stay on localhost"):
#   B  -> 127.0.0.1:18081          local process, scraped directly
#   A  -> 127.0.0.1:9080          SSH tunnel  (scripts/observe-local.sh)
#   C  -> 127.0.0.1:9081          SSH tunnel, non-default port 2222
#   D  -> 127.0.0.1:9082          SSH tunnel
#   9083 is reserved for a fifth endpoint (standby validator or observer).
#
# Prometheus runs with network_mode: host, so these 127.0.0.1 targets are the
# HOST's loopback, not a container-local one.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: stellereum-testnet
    site: build-host
    monitor: prometheus-01

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The four validators. The `node` label is what every alert and dashboard
  # groups on; keep it stable (A/B/C/D) and do not rename it.
  - job_name: stell-nodes
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 127.0.0.1:9080
        labels:
          node: A
          role: validator
          transport: ssh-tunnel
      - targets:
          - 127.0.0.1:18081
        labels:
          node: B
          role: validator
          transport: local
      - targets:
          - 127.0.0.1:9081
        labels:
          node: C
          role: validator
          transport: ssh-tunnel
      - targets:
          - 127.0.0.1:9082
        labels:
          node: D
          role: validator
          transport: ssh-tunnel
      # Reserved for a fifth endpoint (observer / standby). Uncomment only
      # after a tunnel or local process actually listens on 9083; an unused
      # target would keep NodeMetricsUnreachable firing.
      # - targets: ["127.0.0.1:9083"]
      #   labels: {node: E, role: observer, transport: ssh-tunnel}

  # Host that runs this stack: disks, inodes, CPU, load, network.
  #
  # 9101 = the stack's OWN node-exporter (docker-compose.yml `node-exporter`),
  # the one with the textfile collector that publishes
  # `stell_cluster_liveness.prom`. Port 9100 on this host belongs to the
  # separate `grafana-monitoring-stack` compose project; it is intentionally
  # NOT scraped here so the same host metric families are never ingested
  # twice (that would double-count every node_* series in alerts/dashboards).
  # Historical note: this job used to point at 9100 and the stack's exporter
  # could not bind it (`bind: address already in use`) - see README.
  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9101
        labels:
          node: build-host
          role: monitor-host

  # Remote validator hosts (A, C, D) node_exporter via SSH local forwards.
  # Uncomment ONLY after `scripts/setup-validator-monitoring.sh` has installed
  # prometheus-node-exporter (bound strictly to 127.0.0.1:9100 on each remote
  # validator), opened the local SSH forwards (9102->A:9100, 9103->C:9100,
  # 9104->D:9100), and `scripts/setup-validator-monitoring.sh --check` passes —
  # otherwise Prometheus will see down targets / fire NodeMetricsUnreachable
  # before remote node_exporter and tunnels are active.
  # (Validator B runs on this build host and is covered by job `node` above.)
  # - job_name: validator-hosts
  #   static_configs:
  #     - targets:
  #         - 127.0.0.1:9102
  #       labels:
  #         node: A
  #         role: validator
  #         transport: ssh-tunnel
  #     - targets:
  #         - 127.0.0.1:9103
  #       labels:
  #         node: C
  #         role: validator
  #         transport: ssh-tunnel
  #     - targets:
  #         - 127.0.0.1:9104
  #       labels:
  #         node: D
  #         role: validator
  #         transport: ssh-tunnel

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          node: build-host
          role: monitor-host

  - job_name: alertmanager
    static_configs:
      - targets:
          - 127.0.0.1:9093
        labels:
          node: build-host
          role: monitor-host

  - job_name: stell-status
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8095
        labels:
          node: build-host
          role: status-page
