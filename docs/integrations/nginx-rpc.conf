# or ACME via certbot). Uncomment ONE server per hostname, set the real paths,
# then `nginx -t && systemctl reload nginx`. Until then, port 80 only.
# HSTS is intentionally commented too: enabling it before HTTPS works bricks
# plain-HTTP clients for max-age seconds.
