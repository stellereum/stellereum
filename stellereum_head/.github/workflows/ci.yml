name: Stellereum CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build node binary
        run: cargo build --verbose

      - name: Run full test suite (unit, integration & security)
        run: cargo test --verbose

      - name: Verify passport conformance audit
        run: cargo run --release --example passport_audit

      - name: Run security vulnerability regression hunts
        run: |
          cargo run --release --example vuln_hunt
          cargo run --release --example vuln_hunt2
          cargo run --release --example vuln_hunt3
          cargo run --release --example vuln_hunt4
