# prometheus.yml — scrape snippet for the Stellereum two-node stand.
#
# Drop these scrape_configs into the Prometheus server config and point
# rule_files at alerts.rules in this directory:
#
#   rule_files:
#     - "/etc/prometheus/stellereum/alerts.rules"
#
# NOTE (2026-09-26): both nodes currently share ONE explorer port
# (STELL_EXPLORER_LISTEN=127.0.0.1:8080 in both /root/env.A and /root/env.B;
# only one process can bind it, so only one gateway serves /metrics). Until
# nodeB gets its own port (e.g. 8081), both jobs below necessarily scrape the
# same endpoint — per-node attribution comes back once the ports are split
# (uncomment the nodeB target). The RPC ports (8545/8546) stay separate and
# are what check.sh --rpc uses for independent per-node stall sampling.

global:
  scrape_interval: 15s # ~2 samples per readiness N=30s; keeps changes()[2m] meaningful
  evaluation_interval: 30s

scrape_configs:
  - job_name: "stellereum-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels: { node: "shared-gateway" }

  # Per-node jobs: activate once each node has its own STELL_EXPLORER_LISTEN.
  # - job_name: "stellereum-a"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["127.0.0.1:8080"]
  #       labels: { node: "A", rpc_port: "8545" }
  # - job_name: "stellereum-b"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["127.0.0.1:8081"]   # give nodeB STELL_EXPLORER_LISTEN=127.0.0.1:8081 first
  #       labels: { node: "B", rpc_port: "8546" }

  # node_exporter on the box itself — required by the StellDisk* rules.
  - job_name: "node"
    static_configs:
      - targets: ["127.0.0.1:9100"]
