#!/bin/sh
# ==============================================================================
# cluster-nodes.conf — the live 4-validator cluster, as the ops scripts see it.
#
# Sourced by stell-sync.sh, cluster-watchdog.sh and doctor.sh. Every value can
# be overridden from the environment, so a test cluster needs no edits:
#
#   STELL_CONF=/etc/stellereum/cluster.conf ./scripts/stell-sync.sh preflight
#
# WHY A FILE: the cluster topology (who is where, which unit runs it, which
# env file holds its parameters) is EXACTLY the thing that drifted during the
# deployment attempt (env.C had STELL_SHARDS=0 while the others had 0,1, and
# the node was silently isolated on a different pubsub topic). Keeping it in
# one place, machine-readable, is what lets the preflight compare the nodes
# against each other instead of against a human's memory.
# ==============================================================================

# --- the cluster ------------------------------------------------------------
STELL_NODES="${STELL_NODES:-A B C D}"

# Node A — the reference node (public RPC: rpc.stellereum.org).
NODE_A_SSH="${NODE_A_SSH:-root@212.113.103.105}"
NODE_A_SSH_OPTS="${NODE_A_SSH_OPTS:-}"
NODE_A_DIR="${NODE_A_DIR:-/root/nodeA}"
NODE_A_ENV="${NODE_A_ENV:-/root/env.A}"
NODE_A_SERVICE="${NODE_A_SERVICE:-stell-nodeA.service}"
NODE_A_SCOPE="${NODE_A_SCOPE:-system}"
NODE_A_RPC="${NODE_A_RPC:-http://127.0.0.1:8545}"

# Node B — local to the operator box (systemd --user unit).
NODE_B_SSH="${NODE_B_SSH:-}"
NODE_B_SSH_OPTS="${NODE_B_SSH_OPTS:-}"
NODE_B_DIR="${NODE_B_DIR:-/home/imm/stellereum-project/multinode/nodeB}"
NODE_B_ENV="${NODE_B_ENV:-/home/imm/stellereum-project/multinode/nodeB/env.B}"
NODE_B_SERVICE="${NODE_B_SERVICE:-stell-nodeB.service}"
NODE_B_SCOPE="${NODE_B_SCOPE:-user}"
NODE_B_RPC="${NODE_B_RPC:-http://127.0.0.1:8546}"

# Node C — 3rd validator.
NODE_C_SSH="${NODE_C_SSH:-root@213.21.246.5}"
NODE_C_SSH_OPTS="${NODE_C_SSH_OPTS:--p 2222}"
NODE_C_DIR="${NODE_C_DIR:-/root/nodeC}"
NODE_C_ENV="${NODE_C_ENV:-/root/nodeC/env.C}"
NODE_C_SERVICE="${NODE_C_SERVICE:-stell-nodeC.service}"
NODE_C_SCOPE="${NODE_C_SCOPE:-system}"
NODE_C_RPC="${NODE_C_RPC:-http://127.0.0.1:8545}"

# Node D — the 4th validator.
NODE_D_SSH="${NODE_D_SSH:-root@138.124.102.200}"
NODE_D_SSH_OPTS="${NODE_D_SSH_OPTS:-}"
NODE_D_DIR="${NODE_D_DIR:-/root/nodeD}"
NODE_D_ENV="${NODE_D_ENV:-/root/nodeD/env.D}"
NODE_D_SERVICE="${NODE_D_SERVICE:-stell-nodeD.service}"
NODE_D_SCOPE="${NODE_D_SCOPE:-system}"
NODE_D_RPC="${NODE_D_RPC:-http://127.0.0.1:8545}"

# --- the shard each node validates ------------------------------------------
# Canonical public testnet runs single-shard masterchain (shard 0).
NODE_A_SHARD_ID="${NODE_A_SHARD_ID:-0}"
NODE_B_SHARD_ID="${NODE_B_SHARD_ID:-0}"
NODE_C_SHARD_ID="${NODE_C_SHARD_ID:-0}"
NODE_D_SHARD_ID="${NODE_D_SHARD_ID:-0}"

# --- validator ids (immutable, used by the deploy/jail tooling) -------------
NODE_A_VALIDATOR="${NODE_A_VALIDATOR:-48fd69d17c36d5391b7786f8091bce75e55f5b013344b60874090d53e8e8cdf7}"
NODE_B_VALIDATOR="${NODE_B_VALIDATOR:-5762c3311356235a098ed7bc49026cf8f91ba9376f099ef2c7deabeadea88c5a}"
NODE_C_VALIDATOR="${NODE_C_VALIDATOR:-9865d36eb93458ad7739e4de969e8c62b88e662b86f8ec38bd6ff3f83008162f}"
NODE_D_VALIDATOR="${NODE_D_VALIDATOR:-df3d10f3549f492fa829553f9f0a1fe4e6daaf7a74aa532b5411db6eca6d2ba4}"

# --- the values every node MUST agree on ------------------------------------
# These are NETWORK-MEMBERSHIP parameters, not local preferences: a
# difference splits the cluster silently. The preflight refuses to deploy
# when any node disagrees with these or with another node.
EXPECT_STELL_SHARDS="${EXPECT_STELL_SHARDS:-}"
EXPECT_STELL_ROUND_TIMEOUT_MS="${EXPECT_STELL_ROUND_TIMEOUT_MS:-5000}"
EXPECT_STELL_DOWN_PROPOSER_TIMEOUT_MS="${EXPECT_STELL_DOWN_PROPOSER_TIMEOUT_MS:-800}"
EXPECT_STELL_MIN_BLOCK_MS="${EXPECT_STELL_MIN_BLOCK_MS:-800}"
EXPECT_STELL_KEEP_BLOCKS="${EXPECT_STELL_KEEP_BLOCKS:-8000}"
EXPECT_STELL_ARCHIVE="${EXPECT_STELL_ARCHIVE:-0}"
EXPECT_STELL_CHAIN_ID="${EXPECT_STELL_CHAIN_ID:-5757}"
# The admission floor (STELL_MIN_GAS_LIMIT). On the live cluster the value is
# governed on-chain, so the preflight compares the LIVE base fee reported by
# each node's RPC; this is the fallback when the env var is set explicitly.
EXPECT_BASE_FEE="${EXPECT_BASE_FEE:-280000}"

# --- thresholds --------------------------------------------------------------
# Inode usage above this is a warning; above INODE_HARD the node is one
# write away from a read-only filesystem (that is how Node C fell out of
# consensus: 655360/655360 inodes used, df -i at 100%).
INODE_WARN_PCT="${INODE_WARN_PCT:-70}"
INODE_HARD_PCT="${INODE_HARD_PCT:-85}"
# A node whose chunk directory holds more than this many files is a candidate
# for the sweeper.
ORPHAN_WARN_COUNT="${ORPHAN_WARN_COUNT:-20000}"
# The masterchain tip must advance at least once every STALL_SECONDS, or the
# cluster is stalled (the live cluster sat at 285027 in a view-change storm).
STALL_SECONDS="${STALL_SECONDS:-180}"

# --- the ops tool (reads the store: checkpoint, genesis root, lock clear) ---
STELOPS_BIN="${STELOPS_BIN:-/home/imm/stellereum-project/scripts/tools/stelops/target/release/stelops}"
# Where the tool is staged on a remote node.
STELOPS_REMOTE="${STELOPS_REMOTE:-/root/stelops}"

# --- paths of the scripts themselves ----------------------------------------
STELL_SCRIPT_DIR="${STELL_SCRIPT_DIR:-/home/imm/stellereum-project/scripts}"
NODPROBE="${NODPROBE:-${STELL_SCRIPT_DIR}/lib/nodeprobe.sh}"

# --- the local RPC the health screen talks to (node B) ----------------------
HEALTH_RPC="${HEALTH_RPC:-http://127.0.0.1:8546}"
HEALTH_INDEXER="${HEALTH_INDEXER:-http://127.0.0.1:8081}"
