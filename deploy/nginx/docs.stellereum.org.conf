# ------------------------------------------------------------------
# docs.stellereum.org — VitePress documentation site.
# Installed as /etc/nginx/sites-available/stellereum-docs and symlinked
# into sites-enabled. Certificate: the shared stellereum lineage.
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name docs.stellereum.org;

    ssl_certificate /etc/letsencrypt/live/stellereum/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellereum/privkey.pem;

    root /var/www/docs.stellereum.org;
    index index.html;
    client_max_body_size 2M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # VitePress emits content-hashed files under /assets/, but the directory
    # also carries the generated CSS; revalidate so a deploy is visible on the
    # next request instead of after a CDN cache window.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # VitePress clean URLs: /core-concepts/sharding is emitted as
    # core-concepts/sharding.html. Unknown paths must return a real 404 so
    # error_page can serve the generated 404 page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# HTTP -> HTTPS. Certbot manages the certificate for this server_name and
# may replace this block's redirect with its own managed variant.
server {
    listen 80;
    server_name docs.stellereum.org;
    return 301 https://docs.stellereum.org$request_uri;
}
