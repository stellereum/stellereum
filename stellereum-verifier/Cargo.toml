[package]
name = "stellereum-verifier"
version = "0.1.0"
edition = "2021"
description = "Clean-room independent verifier for Stellereum L1 (wire decoding, NIST FIPS 206 Falcon-512, and block/header/xshard commitments)"
license = "MIT OR Apache-2.0"

[dependencies]
bincode = "1.3"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.12"

[dev-dependencies]
stellereum = { path = "../stellereum" }
