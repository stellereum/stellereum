[package]
name = "stellereum-sdk"
version = "0.2.0"
edition = "2021"
readme = "README.md"
description = "Client SDK for Stellereum: Falcon-512 PQ1 transaction construction, signing, RPC client and wallet helpers"
license = "MIT OR Apache-2.0"

[lib]
name = "stellereum_sdk"
path = "src/lib.rs"

[[bin]]
name = "stellereum-sdk-cli"
path = "src/bin/stellereum-sdk-cli.rs"

[features]
# Opt-in parity suite: builds the node crate (heavy) and checks every wire
# byte against the node's own types. OFF by default so `cargo build`,
# `cargo test` and `cargo clippy` for a wallet stay thin.
node-parity = ["dep:stellereum"]

[dependencies]
# Thin, client-only dependency set. The node crate is an OPTIONAL dependency
# used only by the `node-parity` tests; it would otherwise pull
# tokio/axum/sled/wasmi into every wallet.
bincode = "1.3"
blake3 = "1"
hex = "0.4"
pqcrypto-falcon = "0.4.1"
pqcrypto-traits = "0.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
ureq = { version = "2", features = ["json"] }
zeroize = { version = "1", features = ["derive"] }
stellereum = { path = "../stellereum", optional = true }

[profile.dev]
debug = 0

[profile.test]
debug = 0
