# cargo-deny policy for the Stellereum workspace.
#
# CI runs `cargo deny check` on every push (job `deny` in .github/workflows/ci.yml).
# The point is supply-chain hygiene, not pedantry: advisories, licence drift,
# wildcard requirements and unknown registries.

[advisories]
version = 2
# A yanked crate is a warning: upstream may yank for reasons that do not affect
# us (the lockfile is pinned), but it must show up in review.
yanked = "warn"
# Fail on any unmaintained/vulnerable advisory that the RustSec database marks
# relevant to the versions in Cargo.lock.
ignore = []

[licenses]
version = 2
# Permissive set only. Adding a copyleft licence is a deliberate legal decision,
# not something a dependency bump should be able to do silently.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Duplicate crates are common in a graph this size; wildcard version
# requirements are not, and they are what makes a build non-reproducible.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
